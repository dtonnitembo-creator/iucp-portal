<!DOCTYPE html>
<html>
<head>
    <title>IUCP Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }
        h1 {
            color: #38bdf8;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<body>

<!-- 🔐 LOGIN SCREEN -->
<div id="loginScreen">
    <h1>IUCP Login</h1>

    <div class="card">
        <input id="username" placeholder="Enter your name" style="width:100%; padding:8px;"><br><br>

        <select id="userUniversity" style="width:100%; padding:8px;">
            <option>University of Zimbabwe</option>
            <option>NUST</option>
            <option>Midlands State University</option>
        </select><br><br>

        <button onclick="login()" style="padding:10px; background:#38bdf8; border:none; border-radius:5px;">
            Enter Portal
        </button>
    </div>
</div>

<!-- 🌐 DASHBOARD -->
<div id="dashboard" style="display:none;">

    <h1>Inter-University Collaborative Portal</h1>
    <p id="welcomeMsg"></p>

    <h2>Filter by University</h2>
    <select id="universityFilter" onchange="loadData()" style="padding:8px;">
        <option value="All">All Universities</option>
        <option value="University of Zimbabwe">University of Zimbabwe</option>
        <option value="NUST">NUST</option>
        <option value="Midlands State University">Midlands State University</option>
    </select>

    <h2>Create Project</h2>
    <div class="card">
        <input id="title" placeholder="Project Title" style="width:100%; padding:8px;"><br>
        <input id="description" placeholder="Description" style="width:100%; padding:8px;"><br>
        <input id="members" placeholder="Members (comma separated)" style="width:100%; padding:8px;"><br>

        <button onclick="createProject()" style="padding:10px; background:#22c55e; border:none; color:white;">
            Create Project
        </button>
    </div>

    <h2>Users</h2>
    <div id="users"></div>

    <h2>Projects</h2>
    <div id="projects"></div>

</div>
<script>
async function loadData() {

    const filter = document.getElementById('universityFilter').value;
    const usersDiv = document.getElementById('users');
    const projectsDiv = document.getElementById('projects');

    // Loading state (important for demo feel)
    usersDiv.innerHTML = "<div class='card'>Loading users...</div>";
    projectsDiv.innerHTML = "<div class='card'>Loading projects...</div>";

    try {
        const usersRes = await fetch('http://localhost:3000/users');
        const users = await usersRes.json();

        const projectsRes = await fetch('http://localhost:3000/projects');
        const projects = await projectsRes.json();

        usersDiv.innerHTML = "";
        projectsDiv.innerHTML = "";

        users.forEach(u => {
    if (filter !== "All" && u.university !== filter) return;
            usersDiv.innerHTML += `
                <div class="card">
                    <b>${u.name}</b><br>
                    ${u.university}<br>
                    ${u.email}
                </div>
            `;
        });

        projects.forEach(p => {
     if (filter !== "All" && !p.members.some(m => m.includes(filter))) return;
    projectsDiv.innerHTML += `
        <div class="card">
            <b>${p.title}</b><br>
            ${p.description}<br>
            Members: ${p.members ? p.members.join(', ') : 'None'}<br><br>

            <button onclick="deleteProject('${p._id}')"
                style="background:red; color:white; border:none; padding:5px; border-radius:5px;">
                Delete
            </button>
        </div>
    `;
});
    } catch (error) {
        usersDiv.innerHTML = "<div class='card'>Error loading users</div>";
        projectsDiv.innerHTML = "<div class='card'>Error loading projects</div>";
        console.error(error);
    }
}

// Auto-load on page open (IMPORTANT CHANGE)
window.onload = loadData;
async function createProject() {
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const members = document.getElementById('members').value.split(',');

    const res = await fetch('http://localhost:3000/projects', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            title,
            description,
            members
        })
    });

    const data = await res.json();
    console.log("Created:", data);

    // Clear inputs
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('members').value = '';

    // Refresh dashboard
    loadData();
}
async function deleteProject(id) {
    await fetch(`http://localhost:3000/projects/${id}`, {
        method: 'DELETE'
    });

}
function login() {
    const name = document.getElementById('username').value;
    const uni = document.getElementById('userUniversity').value;

    if (!name) {
        alert("Enter your name");
        return;
    }

    // Hide login, show dashboard
    document.getElementById('loginScreen').style.display = "none";
    document.getElementById('dashboard').style.display = "block";

    // Show welcome message
    document.getElementById('welcomeMsg').innerText =
        "Welcome " + name + " (" + uni + ")";

    loadData();
}
</script>

</body>
</html>
